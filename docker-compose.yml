version: '3'
services:
  web:
    image: openevocracy/openevocracy:v0.3
    ports:
     - $PORT:8080
    depends_on:
     - mongodb
    restart: always
    volumes:
     - ./shared/:/home/node/app/shared/
     - ./files/:/home/node/app/files/
    environment:
     - ENV=prod
  mongodb:
    image: mongo:3
    restart: always
    volumes:
    - ./data:/data/db
